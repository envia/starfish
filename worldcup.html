<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { font-family: sans-serif; color: #f5f7fa; }
  
  /* 세련된 스포티 다크 그라디언트 테마 */
  .panel {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    padding: 40px;
    background: linear-gradient(135deg, rgba(10, 15, 30, 0.9) 0%, rgba(20, 25, 50, 0.85) 100%);
    border-left: 8px solid #00e5ff; /* 스카이블루 아쿠아 데코 바 포인트 */
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
  }

  .header {
    margin-bottom: 24px;
  }

  /* 스포티하게 꺾인 사선 스타일 레이아웃 포인트 */
  .title-accent-box {
    display: inline-block;
    background: #00e5ff;
    color: #0b0f19;
    font-size: 24px;
    font-weight: 900;
    padding: 6px 16px;
    transform: skewX(-15deg);
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  .title {
    font-size: 44px;
    font-weight: 800;
    color: #ffffff;
    margin: 0;
    text-shadow: 0 4px 8px rgba(0,0,0,0.5);
  }

  .content-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 20px;
    padding: 24px;
    border: 1px solid rgba(0, 229, 255, 0.15);
  }

  /* 역동적인 한국 축구 이미지 */
  .wc-img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    border-radius: 16px;
    border: 3px solid #00e5ff;
    box-shadow: 0 8px 24px rgba(0, 229, 255, 0.3);
  }

  .status-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .status-card {
    background: rgba(0, 0, 0, 0.4);
    border-radius: 14px;
    padding: 16px;
    border-bottom: 4px solid #00e5ff;
  }

  .status-label {
    font-size: 20px;
    color: #a0aec0;
    margin-bottom: 8px;
  }

  .status-value {
    font-size: 32px;
    font-weight: 800;
    color: #ffffff;
  }

  .match-result-banner {
    background: rgba(0, 229, 255, 0.1);
    border: 2px dashed #00e5ff;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
  }

  .match-text {
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.5;
  }

  .highlight {
    color: #00e5ff;
    font-weight: 800;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div class="title-accent-box">FIFA WORLD CUP 2026</div>
      <h1 class="title">대한민국 국가대표팀 현황</h1>
    </div>

    <div class="content-box">
      <!-- 붉은 함성의 축구 스타디움 비주얼 이미지 사용 -->
      <img class="wc-img" src="https://images.unsplash.com/photo-1518091043644-c1d4457512c6?auto=format&fit=crop&w=800&q=80" alt="World Cup Red Devils">
      
      <div class="status-grid">
        <div class="status-card">
          <div class="status-label">🏆 본선 무대</div>
          <div class="status-value">A조 배정 완료</div>
        </div>
        <div class="status-card">
          <div class="status-label">📊 현재 순위</div>
          <div class="status-value highlight">조 2위 (승점 3점)</div>
        </div>
        <div class="status-card">
          <div class="status-label">✨ 최근 경기</div>
          <div class="status-value">체코전 2-1 승리</div>
        </div>
        <div class="status-card">
          <div class="status-label">⚔️ 다음 상대</div>
          <div class="status-value">남아공 / 멕시코</div>
        </div>
      </div>

      <div class="match-result-banner">
        <p class="match-text">
          본선 <span class="highlight">A조 1차전</span>에서 <span class="highlight">체코를 2-1로 격파</span>하며<br>
          기분 좋은 첫 승과 함께 <span class="highlight">조 2위</span>로 쾌조의 출발을 보였습니다!
        </p>
      </div>
    </div>
  </div>
</body>
</html>
