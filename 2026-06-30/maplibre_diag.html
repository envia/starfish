<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>html,body{margin:0;height:100%;background:#888}#map{position:absolute;inset:0}</style>
</head><body><div id="map"></div>
<script>
window.__r=[]; var errs=0, dataTiles=0, srcData=0;
function rec(m){window.__r.push(String(m));}
var map=new maplibregl.Map({container:'map',style:'https://demotiles.maplibre.org/style.json',center:[10,45],zoom:3});
map.on('error',function(e){ errs++; if(errs<=6){ var er=e&&e.error?e.error:e; rec('ERR:'+((er&&er.message)?er.message:JSON.stringify(er)).slice(0,160)); } });
map.on('data',function(e){ if(e.dataType==='source'){ srcData++; if(e.tile) dataTiles++; } });
map.on('load',function(){ rec('LOAD'); });
map.on('idle',function(){ rec('IDLE srcData='+srcData+' tiles='+dataTiles+' errs='+errs+' loaded='+map.loaded()); });
setTimeout(function(){
  rec('FINAL srcData='+srcData+' tiles='+dataTiles+' errs='+errs);
  try{ rec('sourceLoaded='+map.isSourceLoaded('maplibre')); }catch(e){ rec('isSourceLoaded threw:'+e); }
  throw new Error('DIAG_RESULT '+JSON.stringify(window.__r));
}, 12000);
</script></body></html>
