<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="background:#fff">
<script>
window.__r=[];
function rec(m){window.__r.push(String(m));}
try {
  var w = new Worker('worker_xfer_child.js');
  w.onmessage=function(e){
    var d=e.data||{};
    if (d.ready){ rec('ready'); 
      var b=new Uint8Array([9,9,9]).buffer;
      w.postMessage({tag:'hello', buf:b},[b]);
      rec('mainSentBuf; neutered='+(b.byteLength===0));
      return;
    }
    rec('recv from='+d.from+' inLen='+d.inLen+' tag='+d.tag);
    if (d.out){ var o=new Uint8Array(d.out); rec('out='+Array.from(o).join(',')); }
    else rec('out=MISSING');
  };
  w.onerror=function(e){rec('WERR:'+(e.message||e.filename||'err'));};
} catch(e){ rec('threw:'+e); }
setTimeout(function(){ throw new Error('XFER_RESULT '+JSON.stringify(window.__r)); }, 6000);
</script></body></html>
