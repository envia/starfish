<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Blob URL fetch test</title></head>
<body style="background:#fff">
<script>
window.__r = [];
function rec(m){ window.__r.push(String(m)); }
var src = "self.postMessage('started');self.onmessage=function(e){self.postMessage('got:'+e.data);};";
var blob = new Blob([src], {type:'application/javascript'});
var url = URL.createObjectURL(blob);
rec('url=' + (url ? url.slice(0,32) : 'null'));

// (A) fetch the blob URL on the MAIN thread
try {
  fetch(url)
    .then(function(r){ rec('mainfetch-status=' + r.status); return r.text(); })
    .then(function(t){ rec('mainfetch-len=' + t.length); })
    .catch(function(e){ rec('mainfetch-err=' + e); });
} catch(e){ rec('mainfetch-throw=' + e); }

// (B) also create a worker from the same blob URL
try {
  var w = new Worker(url);
  w.onmessage = function(e){ rec('W:' + e.data); };
  w.onerror = function(e){ rec('WERR:' + (e.message || e.filename || 'err')); };
  w.postMessage('ping');
} catch(e){ rec('worker-throw=' + e); }

setTimeout(function(){ throw new Error('WT3_RESULT ' + JSON.stringify(window.__r)); }, 7000);
</script>
</body>
</html>
