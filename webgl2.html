<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebGL Demo</title>
    <script>
      window.onload = function main() {
        //
        // start here
        //
        const canvas = document.querySelector("#gl-canvas");
        const p = document.querySelector("#gl-p");

        // Initialize the GL context
        const gl = canvas.getContext("webgl2");

        // Only continue if WebGL is available and working
        if (gl === null) {
          p.textContent = "WebGL not initialized.";
          return;
        }
        // https://github.com/KhronosGroup/WebGL/blob/main/other/get.webgl.org/webgl2/index.html
        var params = [
          { pname: 'MAX_3D_TEXTURE_SIZE', min: 256, },
          { pname: 'MAX_DRAW_BUFFERS', min:4, },
          { pname: 'MAX_COLOR_ATTACHMENTS', min:4, },
          { pname: 'MAX_VERTEX_UNIFORM_BLOCKS', min:12, },
          { pname: 'MAX_VERTEX_TEXTURE_IMAGE_UNITS', min:16, },
          { pname: 'MAX_FRAGMENT_INPUT_COMPONENTS', min:60, },
          { pname: 'MAX_UNIFORM_BUFFER_BINDINGS', min:24, },
          { pname: 'MAX_COMBINED_UNIFORM_BLOCKS', min:24, },
        ];
        for (var i = 0; i < params.length; ++i) {
          var param = params[i];
          var value = gl.getParameter(gl[param.pname]);
          if (typeof value !== 'number' || Number.isNaN(value) || value < params.min) {
            p.textContent = "WebGL not implemented.";
            return;
          }
        }
        p.textContent = "WebGL initialized.";

        // Set clear color to black, fully opaque
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        // Clear the color buffer with specified clear color
        gl.clear(gl.COLOR_BUFFER_BIT);
      }
    </script>
  </head>

  <body>
    <canvas id="gl-canvas" width="640" height="480"></canvas>
    <p id="gl-p"></p>
  </body>
</html>
